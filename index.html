<style>

<div id="menu"><h1>🛡️ Knight Battle 3D</h1><p style="font-size:24px;text-align:center">You are the Blue Knight! Lead your Blue Knight army against the Red Knights!<br>Swing your sword, hold your shield to block!</p><div class="b" id="play">▶ PLAY</div><p id="best" style="font-size:22px"></p></div>

<script type="module">
import * as T from './three.module.min.js';
const $=id=>document.getElementById(id);

$('best').textContent='🪙 '+save.coins+'   Best wave: '+save.best;
// renderer
const R=new T.WebGLRenderer({antialias:true});R.setPixelRatio(Math.min(devicePixelRatio,2));R.shadowMap.enabled=true;document.body.prepend(R.domElement);
const S=new T.Scene();S.background=new T.Color(0x8fd3ff);S.fog=new T.Fog(0x8fd3ff,60,140);
const C=new T.PerspectiveCamera(60,1,.1,400);
function rs(){R.setSize(innerWidth,innerHeight);C.aspect=innerWidth/innerHeight;C.updateProjectionMatrix()}addEventListener('resize',rs);rs();
S.add(new T.HemisphereLight(0xffffff,0x5a8a3a,1.1));const sun=new T.DirectionalLight(0xffffff,1.6);sun.position.set(20,40,15);sun.castShadow=true;
Object.assign(sun.shadow.camera,{left:-40,right:40,top:40,bottom:-40});sun.shadow.mapSize.set(1024,1024);S.add(sun);
const M=c=>new T.MeshLambertMaterial({color:c});
const box=(w,h,d,c)=>{const m=new T.Mesh(new T.BoxGeometry(w,h,d),M(c));m.castShadow=m.receiveShadow=true;return m};
// arena
const AR=30;
const g=new T.Mesh(new T.CircleGeometry(120,48),M(0x5cb84a));g.rotation.x=-Math.PI/2;g.receiveShadow=true;S.add(g);
const sand=new T.Mesh(new T.CircleGeometry(AR,48),M(0xe6c98a));sand.rotation.x=-Math.PI/2;sand.position.y=.02;sand.receiveShadow=true;S.add(sand);
for(let i=0;i<40;i++){const a=i/40*Math.PI*2;const f=box(1.2,1.4,1.2,0x9b6b3a);f.position.set(Math.cos(a)*(AR+1),.7,Math.sin(a)*(AR+1));S.add(f);}
// castle
const castle=new T.Group();const wall=box(30,10,4,0xb8b8c8);wall.position.y=5;castle.add(wall);
for(const x of[-15,15]){const t=new T.Mesh(new T.CylinderGeometry(3,3,16,12),M(0xa8a8bb));t.position.set(x,8,0);castle.add(t);const r=new T.Mesh(new T.ConeGeometry(3.8,6,12),M(0x2a6fd6));r.position.set(x,19,0);castle.add(r);}
for(let i=-6;i<=6;i++){const c=box(1.4,1.6,4.2,0xb8b8c8);c.position.set(i*2.3,10.8,0);castle.add(c);}
const door=box(6,7,.5,0x6b4423);door.position.set(0,3.5,2.1);castle.add(door);
const flag=box(3,2,.1,0xffd84a);flag.position.set(1.5,23,0);castle.add(flag);const pole=box(.2,6,.2,0x555555);pole.position.set(0,21,0);castle.add(pole);
castle.position.set(0,0,-AR-14);S.add(castle);
const rc=castle.clone(true);rc.traverse(o=>{if(o.isMesh&&o.geometry.type=='ConeGeometry'){o.material=M(0xc8312a)}});rc.position.set(0,0,AR+14);rc.rotation.y=Math.PI;S.add(rc);
for(const z of[-AR,AR]){const gp=new T.Mesh(new T.PlaneGeometry(6,12),M(0xc9b07a));gp.rotation.x=-Math.PI/2;gp.position.set(0,.03,z+(z<0?-5:5));S.add(gp)}
for(let i=0;i<30;i++){const a=Math.random()*Math.PI*2,d=AR+12+Math.random()*50;if(Math.abs(Math.cos(a))<.45&&d<75)continue;const t=new T.Group();const tr=box(.8,3,.8,0x7a4a24);tr.position.y=1.5;t.add(tr);const l=new T.Mesh(new T.SphereGeometry(2.4,8,6),M(0x2f8f2f));l.position.y=4.5;l.castShadow=true;t.add(l);t.position.set(Math.cos(a)*d,0,Math.sin(a)*d);S.add(t);}
for(let i=0;i<6;i++){const c=new T.Mesh(new T.SphereGeometry(4,8,6),new T.MeshBasicMaterial({color:0xffffff}));c.scale.set(2,.7,1);c.position.set(Math.random()*200-100,45+Math.random()*10,Math.random()*200-100);S.add(c);}
// knight builder
function knight(body,trim,plume){
  const k=new T.Group();const m=new T.Group();k.add(m);
  const legL=box(.45,.9,.45,trim),legR=legL.clone();legL.position.set(-.25,.45,0);legR.position.set(.25,.45,0);m.add(legL,legR);
  const tor=box(1.1,1.1,.7,body);tor.position.y=1.45;m.add(tor);const belt=box(1.15,.18,.75,0x6b4423);belt.position.y=1;m.add(belt);
  const head=new T.Mesh(new T.SphereGeometry(.5,14,10),M(trim));head.position.y=2.4;head.castShadow=true;m.add(head);
  const visor=box(.7,.12,.1,0x111111);visor.position.set(0,2.45,.47);m.add(visor);
  const eyeM=new T.MeshBasicMaterial({color:0xffffff});for(const x of[-.15,.15]){const e=new T.Mesh(new T.SphereGeometry(.06,6,6),eyeM);e.position.set(x,2.45,.53);m.add(e);}
  const pl=new T.Mesh(new T.ConeGeometry(.18,.7,8),M(plume));pl.position.y=3.05;m.add(pl);
  // sword arm (pivot at shoulder)
  const sa=new T.Group();sa.position.set(.7,1.85,0);m.add(sa);const arm=box(.3,.8,.3,body);arm.position.y=-.35;sa.add(arm);
  const sw=new T.Group();sw.position.set(0,-.7,.1);sa.add(sw);const blade=box(.15,1.6,.06,0xe8eef5);blade.position.y=.95;const hilt=box(.5,.12,.15,0xc99a2e);hilt.position.y=.15;sw.add(blade,hilt);sw.rotation.x=Math.PI/2;
  // shield arm
  const ha=new T.Group();ha.position.set(-.75,1.6,.2);m.add(ha);const sh=new T.Mesh(new T.CylinderGeometry(.6,.6,.12,16),M(trim));sh.rotation.x=Math.PI/2;sh.castShadow=true;ha.add(sh);
  const emb=new T.Mesh(new T.CylinderGeometry(.3,.3,.14,5),M(plume));emb.rotation.x=Math.PI/2;emb.position.z=.02;ha.add(emb);ha.rotation.y=-.6;
  Object.assign(k.userData,{m,legL,legR,sa,ha,sw});return k;
}
// player
const P=knight(0x2a6fd6,0xc8d0dc,0xffd84a);S.add(P);
const pl={hp:100,max:100,vy:0,yaw:0,atk:0,block:false,hurt:0,jumpT:0,cd:0};
// enemies
let reinT=6,E=[],wave=0,coins=save.coins,FX=[],drops=[],playing=false,waveT=0,beaten=0;
const COL=[[0xc8312a,0x2b2b2b,0x111111],[0x8a1f8a,0x2b2b2b,0xff6a00],[0x222222,0xc8312a,0xffd84a]];
function hpbar(){const c=document.createElement('canvas');c.width=64;c.height=10;const t=new T.CanvasTexture(c);const s=new T.Sprite(new T.SpriteMaterial({map:t,depthTest:false}));s.scale.set(1.6,.25,1);s.position.y=3.6;s.userData={c,t};return s}
function drawbar(s,f){const x=s.userData.c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,64,10);x.fillStyle='#600';x.fillRect(2,2,60,6);x.fillStyle=f>.5?'#3d3':f>.25?'#fc3':'#f33';x.fillRect(2,2,60*f,6);s.userData.t.needsUpdate=true}
function spawn(boss,team='r'){const c=team=='b'?[0x4f9cff,0xc8d0dc,0x2bc24a]:boss?COL[2]:COL[Math.random()<.7?0:1];const k=knight(...c);if(boss)k.scale.setScalar(1.6);
  const z=team=='b'?-AR+2:AR-2;k.position.set((Math.random()-.5)*6,0,z);k.rotation.y=team=='b'?0:Math.PI;const b=hpbar();k.add(b);S.add(k);
  const hp=(boss?120:30)+wave*6;E.push({k,b,hp,max:hp,team,hunter:team=='r'&&(boss||Math.random()<.35),tg:null,atk:0,cd:1+Math.random()*2,block:0,kb:new T.Vector3(),hurt:0,boss,spd:2.6+Math.min(wave*.15,1.6)});drawbar(b,1);}
function nextWave(){wave++;$('wave').textContent='⚔️ Wave '+wave;const n=Math.min(3+wave,12);let q=n;const mi=setInterval(()=>{if(!playing||q--<=0)return clearInterval(mi);spawn(false)},700);for(let i=0;i<Math.min(2+wave,8)-allies();i++)setTimeout(()=>playing&&allies()<8&&spawn(false,'b'),i*900);if(wave%5==0)spawn(true);
  say(wave%5==0?'Wave '+wave+'! The Black Knight boss is here!':'Wave '+wave+'! Here they come!');show(wave%5==0?'👑 BOSS WAVE '+wave:'⚔️ WAVE '+wave);}
const allies=()=>E.filter(e=>e.team=='b').length,reds=()=>E.filter(e=>e.team=='r');
// fx
function sparkles(p,n,col){for(let i=0;i<n;i++){const s=new T.Mesh(new T.OctahedronGeometry(.18),new T.MeshBasicMaterial({color:col||[0xffe033,0xff6ad5,0x6af0ff,0xffffff][i%4]}));s.position.copy(p);s.position.y+=1.5;
  FX.push({s,v:new T.Vector3((Math.random()-.5)*8,Math.random()*8+2,(Math.random()-.5)*8),t:1});S.add(s);}}
function drop(p,heart){const o=heart?new T.Mesh(new T.SphereGeometry(.4,10,8),new T.MeshBasicMaterial({color:0xff3366})):new T.Mesh(new T.CylinderGeometry(.4,.4,.1,16),new T.MeshLambertMaterial({color:0xffd23a,emissive:0x664400}));
  if(!heart)o.rotation.x=Math.PI/2;else{const o2=o.clone();o2.position.x=.3;o.add(o2);o.scale.set(.8,.8,.8)}o.position.set(p.x+(Math.random()-.5)*2,.8,p.z+(Math.random()-.5)*2);S.add(o);drops.push({o,heart,t:15});}
// audio
let AC;const tone=(f,d,type='square',v=.15,f2)=>{if(!AC)return;const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;if(f2)o.frequency.exponentialRampToValueAtTime(f2,AC.currentTime+d);g.gain.setValueAtTime(v,AC.currentTime);g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.connect(g).connect(AC.destination);o.start();o.stop(AC.currentTime+d)};
const noise=(d,v=.2,hp=800)=>{if(!AC)return;const b=AC.createBuffer(1,AC.sampleRate*d,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<a.length;i++)a[i]=(Math.random()*2-1)*(1-i/a.length);const s=AC.createBufferSource();s.buffer=b;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=hp;const g=AC.createGain();g.gain.value=v;s.connect(f).connect(g).connect(AC.destination);s.start()};
const sfx={swing:()=>noise(.18,.25,2000),hit:()=>{tone(180,.15,'square',.2,80);noise(.1,.2,400)},clang:()=>{tone(1400,.35,'triangle',.2);tone(2100,.25,'sine',.1)},poof:()=>{tone(500,.4,'sine',.2,1500);noise(.3,.12,3000)},
coin:()=>{tone(990,.08,'square',.1);setTimeout(()=>tone(1320,.15,'square',.1),70)},heart:()=>{tone(660,.1,'sine',.2);setTimeout(()=>tone(880,.2,'sine',.2),100)},ouch:()=>tone(300,.25,'sawtooth',.15,150),jump:()=>tone(300,.2,'sine',.15,700),
fan:()=>[523,659,784,1046].forEach((f,i)=>setTimeout(()=>tone(f,.25,'square',.12),i*120))};
function say(t){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.rate=1;u.pitch=1.1;speechSynthesis.speak(u)}catch(e){}}
let mt;function show(t){$('msg').textContent=t;$('msg').style.display='block';clearTimeout(mt);mt=setTimeout(()=>$('msg').style.display='none',1800)}
// input
const J={x:0,y:0},K={sword:0,shield:0,jump:0};const joy=$('joy'),knob=$('knob');let jid=null;
function jm(t){const r=joy.getBoundingClientRect();let x=(t.clientX-r.left-r.width/2)/80,y=(t.clientY-r.top-r.height/2)/80;const l=Math.hypot(x,y);if(l>1){x/=l;y/=l}J.x=x;J.y=y;knob.style.left=55+x*55+'px';knob.style.top=55+y*55+'px'}
joy.addEventListener('touchstart',e=>{e.preventDefault();const t=e.changedTouches[0];jid=t.identifier;jm(t)});
joy.addEventListener('touchmove',e=>{e.preventDefault();for(const t of e.changedTouches)if(t.identifier==jid)jm(t)});
const jend=e=>{for(const t of e.changedTouches)if(t.identifier==jid){jid=null;J.x=J.y=0;knob.style.left=knob.style.top='55px'}};joy.addEventListener('touchend',jend);joy.addEventListener('touchcancel',jend);
let md=false;joy.addEventListener('mousedown',e=>{md=true;jm(e)});addEventListener('mousemove',e=>md&&jm(e));addEventListener('mouseup',()=>{if(md){md=false;J.x=J.y=0;knob.style.left=knob.style.top='55px'}});
for(const id of['sword','shield','jump']){const el=$(id);const on=e=>{e.preventDefault();K[id]=1;el.classList.add('on');if(id=='sword')attack();if(id=='jump')jump()};const off=e=>{e.preventDefault();K[id]=0;el.classList.remove('on')};
 el.addEventListener('touchstart',on);el.addEventListener('touchend',off);el.addEventListener('touchcancel',off);el.addEventListener('mousedown',on);el.addEventListener('mouseup',off);el.addEventListener('mouseleave',off)}
const KB={};addEventListener('keydown',e=>{KB[e.code]=1;if(e.code=='KeyJ')attack();if(e.code=='Space')jump()});addEventListener('keyup',e=>KB[e.code]=0);
function jump(){if(!playing||P.position.y>.01)return;pl.vy=9;sfx.jump()}
function attack(){if(!playing||pl.cd>0)return;pl.atk=.35;pl.cd=.4;sfx.swing();
  const f=new T.Vector3(Math.sin(pl.yaw),0,Math.cos(pl.yaw));let hit=false;
  for(const e of E){if(e.team!='r')continue;const d=e.k.position.clone().sub(P.position);d.y=0;const L=d.length(),r=e.boss?3.6:2.9;if(L>r)continue;if(d.normalize().dot(f)<.2)continue;
    const fe=new T.Vector3(Math.sin(e.k.rotation.y),0,Math.cos(e.k.rotation.y));
    if(e.block>0&&fe.dot(d)<-.5){sfx.clang();sparkles(e.k.position,4,0xffffaa);e.kb.copy(d).multiplyScalar(4);continue}
    hit=true;e.hp-=e.boss?12:15;e.hurt=.25;e.kb.copy(d).multiplyScalar(e.boss?6:12);drawbar(e.b,Math.max(e.hp,0)/e.max);
    if(Math.random()<.35)e.block=1.2; // they learn to block
    if(e.hp<=0)beat(e)}
  if(hit)sfx.hit()}
function beat(e,byPlayer=true){sparkles(e.k.position,e.boss?40:18,e.team=='b'?0x8fd3ff:undefined);sfx.poof();S.remove(e.k);E=E.filter(x=>x!=e);if(e.team=='r'&&byPlayer){beaten++;const n=e.boss?10:2;for(let i=0;i<n;i++)drop(e.k.position,false);if(Math.random()<.3)drop(e.k.position,true);}if(e.boss){say('You beat the Black Knight!');}}
// loop
let last=performance.now(),camYaw=Math.PI;
function step(dt){
  const t=performance.now()/1000;
  // player move
  let jx=J.x+(KB.KeyD?1:0)-(KB.KeyA?1:0),jy=J.y+(KB.KeyS?1:0)-(KB.KeyW?1:0);
  pl.block=K.shield||KB.KeyK;const sp=pl.block?3:7;
  const mv=new T.Vector3(jx,0,jy);if(mv.length()>.1){mv.applyAxisAngle(new T.Vector3(0,1,0),camYaw);if(mv.length()>1)mv.normalize();P.position.addScaledVector(mv,sp*dt);
    const ty=Math.atan2(mv.x,mv.z);let dy=ty-pl.yaw;dy=Math.atan2(Math.sin(dy),Math.cos(dy));pl.yaw+=dy*Math.min(1,dt*12);}
  const pr=Math.hypot(P.position.x,P.position.z);if(pr>AR-1){P.position.x*=(AR-1)/pr;P.position.z*=(AR-1)/pr}
  pl.vy-=25*dt;P.position.y=Math.max(0,P.position.y+pl.vy*dt);if(P.position.y==0)pl.vy=0;
  P.rotation.y=pl.yaw;anim(P,mv.length()>.1,pl.atk,pl.block,t);pl.atk=Math.max(0,pl.atk-dt);pl.cd-=dt;pl.hurt-=dt;
  P.userData.m.visible=!(pl.hurt>0&&Math.floor(t*20)%2);
  // enemies
  reinT-=dt;if(reinT<0){reinT=6;if(allies()<Math.min(2+wave,8))spawn(false,'b');}
  for(const e of [...E]){const k=e.k;if(!e.tg||!(e.tg=='P'||E.includes(e.tg))||Math.random()<dt*.3){e.tg=null;if(e.team=='r'&&(e.hunter||allies()==0))e.tg='P';else{let bd=1e9;for(const o of E)if(o.team!=e.team){const l=o.k.position.distanceTo(k.position)+(e.team=='r'&&o.tg==null?0:0);if(l<bd){bd=l;e.tg=o}}if(!e.tg)e.tg=e.team=='r'?'P':null}}
    const tp=e.tg=='P'?P.position:e.tg?e.tg.k.position:new T.Vector3(P.position.x+2*Math.sin(t+E.indexOf(e)),0,P.position.z-3);
    const d=tp.clone().sub(k.position);d.y=0;const L=d.length();const want=Math.atan2(d.x,d.z);let dy=want-k.rotation.y;dy=Math.atan2(Math.sin(dy),Math.cos(dy));k.rotation.y+=dy*Math.min(1,dt*5);
    const reach=e.boss?3.2:2.4;let moving=false;
    if(e.hurt<=0&&e.atk<=0&&L>reach-.4){k.position.addScaledVector(d.normalize(),e.spd*(e.block>0?.5:1)*dt);moving=true}
    for(const o of E)if(o!=e){const s=k.position.clone().sub(o.k.position);s.y=0;const l=s.length();if(l<1.6&&l>0)k.position.addScaledVector(s.normalize(),(1.6-l)*.5)}
    k.position.addScaledVector(e.kb,dt);e.kb.multiplyScalar(Math.pow(.02,dt));const kr=Math.hypot(k.position.x,k.position.z);if(kr>AR-1){k.position.x*=(AR-1)/kr;k.position.z*=(AR-1)/kr}
    e.cd-=dt;e.block-=dt;e.hurt-=dt;
    if(e.tg&&e.cd<=0&&L<reach&&e.hurt<=0){e.atk=.6;e.cd=(e.boss?1.4:2)+Math.random()*1.2;e.hit=false;e.block=0}
    if(e.atk>0){e.atk-=dt;if(!e.hit&&e.atk<.3){e.hit=true;const L2=P.position.distanceTo(k.position);if(e.tg=='P'){if(L2<reach+.5&&P.position.y<1.2)hurtPlayer(e,k)}else if(e.tg&&e.tg.k.position.distanceTo(k.position)<reach+.5)hitUnit(e,e.tg)}}
    anim(k,moving,e.atk>0?e.atk*.58:0,e.block>0,t);
    k.userData.m.position.y=e.hurt>0?.15:0;k.userData.m.children[2].material.emissive?.setHex(e.hurt>0?0x664400:0)}
  // drops
  for(const d of drops){d.t-=dt;d.o.rotation.z+=dt*3;d.o.rotation.y+=dt*2;d.o.position.y=.8+Math.sin(t*4)*.15;const L=d.o.position.distanceTo(P.position.clone().setY(.8));
    if(L<4){d.o.position.lerp(P.position.clone().setY(1),dt*8)}if(L<1.2){d.t=-1;if(d.heart){pl.hp=Math.min(pl.max,pl.hp+25);sfx.heart();show('❤️ +25')}else{coins++;save.coins=coins;store();sfx.coin()}}if(d.t<0)S.remove(d.o)}
  drops=drops.filter(d=>d.t>=0);
  for(const f of FX){f.t-=dt*1.2;f.v.y-=12*dt;f.s.position.addScaledVector(f.v,dt);f.s.rotation.x+=dt*8;f.s.scale.setScalar(Math.max(f.t,.01));if(f.t<=0)S.remove(f.s)}FX=FX.filter(f=>f.t>0);
  if(reds().length==0){waveT+=dt;if(waveT>2.5){waveT=0;nextWave()}else if(waveT<dt*1.5&&wave>0){sfx.fan();say('Wave cleared! Great job!');show('🏆 Wave cleared!')}}
  $('hp').style.width=pl.hp+'%';$('left').textContent='🔵 '+allies()+'  🔴 '+reds().length;$('coins').textContent='🪙 '+coins;
  // camera
  const cd=9,ch=6;C.position.lerp(new T.Vector3(P.position.x-Math.sin(camYaw)*-0+0,P.position.y+ch,P.position.z-cd),Math.min(1,dt*5));C.lookAt(P.position.x,P.position.y+1.5,P.position.z+4);
}
function anim(k,moving,atk,block,t){const u=k.userData;const s=moving?Math.sin(t*12)*.6:0;u.legL.rotation.x=s;u.legR.rotation.x=-s;
  u.sa.rotation.x=atk>0?(-2.4+(.35-atk)/.35*3.4):-.3+(moving?Math.sin(t*12)*.2:0);
  u.ha.position.x=block?-.2:-.75;u.ha.position.z=block?.75:.2;u.ha.rotation.y=block?0:-.6;u.ha.position.y=block?1.8:1.6}
function hitUnit(a,o){const d=o.k.position.clone().sub(a.k.position);d.y=0;d.normalize();const fo=new T.Vector3(Math.sin(o.k.rotation.y),0,Math.cos(o.k.rotation.y));
  if(o.block>0&&fo.dot(d)<-.5){sfx.clang();sparkles(o.k.position,3,0xffffaa);return}
  o.hp-=a.boss?14:8;o.hurt=.25;o.kb.copy(d).multiplyScalar(8);drawbar(o.b,Math.max(o.hp,0)/o.max);if(Math.random()<.4)o.block=1;if(o.hp<=0)beat(o,false);else tone(220,.08,'square',.06)}
function hurtPlayer(e,k){const d=P.position.clone().sub(k.position);d.y=0;d.normalize();const f=new T.Vector3(Math.sin(pl.yaw),0,Math.cos(pl.yaw));
  if(pl.block&&f.dot(d)<-.3){sfx.clang();sparkles(P.position.clone().addScaledVector(d,-.8),5,0xffffaa);e.kb.copy(d).multiplyScalar(-6);return}
  if(pl.hurt>0)return;pl.hp-=e.boss?15:9;pl.hurt=.6;sfx.ouch();P.position.addScaledVector(d,1);
  if(pl.hp<=0){playing=false;save.best=Math.max(save.best,wave);store();$('ovt').innerHTML='You reached wave '+wave+'!<br>Knights beaten: '+beaten+'<br>🪙 '+coins;$('over').style.display='flex';say('Great fight, brave knight! Want to try again?')}}
function loop(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(playing)step(dt);else for(const f of FX)f.t=0;R.render(S,C);requestAnimationFrame(loop)}
C.position.set(0,8,-AR-2);C.lookAt(0,1,0);requestAnimationFrame(loop);
function start(){P.position.set(0,0,-AR+8);pl.hp=100;pl.yaw=0;for(const e of E)S.remove(e.k);E=[];for(const d of drops)S.remove(d.o);drops=[];wave=0;beaten=0;waveT=0;playing=true;
  $('menu').style.display='none';$('over').style.display='none';$('hud').style.display='block';nextWave()}
$('play').addEventListener('click',()=>{try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();AC.resume()}catch(e){}say('Welcome, brave Blue Knight! Tap sword to swing, and hold shield to block!');sfx.fan();start()});
$('again').addEventListener('click',start);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
window.__kn={P,pl,get E(){return E},K,J,attack,spawn,get drops(){return drops},nextWave,beat};
